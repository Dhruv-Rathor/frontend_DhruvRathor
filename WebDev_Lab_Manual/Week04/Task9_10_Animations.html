<!DOCTYPE html>
<html>
<head>
<style>
    /* Space Animation */
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }
    .rocket { width: 50px; height: 50px; background: red; animation: float 2s infinite ease-in-out; }

    /* Nav Transitions */
    nav a { 
        padding: 10px; 
        text-decoration: none; 
        color: black; 
        transition: all 0.5s; 
    }
    nav a:hover { 
        background: black; 
        color: white; 
        padding: 20px; 
    }
</style>
</head>
<body>
    <nav>
        <a href="#">Home</a> | <a href="#">About</a>
    </nav>
    <br><br>
    <div class="rocket">🚀</div>
</body>
</html>
