<!DOCTYPE html>
<html>
<body>
    <h2>JS Basics</h2>
    <script>
        // Task 12: Welcome
        let user = prompt("Enter your name:");
        if(user) {
            document.write("<h3>Welcome, " + user + "!</h3>");
        }

        // Task 13: Eligibility
        let age = prompt("Enter your age:");
        let status = (age >= 18) ? "Eligible to vote" : "Not eligible";
        alert(status);
    </script>
</body>
</html>
