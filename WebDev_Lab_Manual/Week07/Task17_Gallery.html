<!DOCTYPE html>
<html>
<style> img { width: 100px; cursor: pointer; } #main { width: 300px; } </style>
<body>
    <img id="main" src="https://via.placeholder.com/300/FF0000" alt="Main"><br>
    <div id="thumbs">
        <img src="https://via.placeholder.com/300/FF0000" data-src="https://via.placeholder.com/300/FF0000">
        <img src="https://via.placeholder.com/300/00FF00" data-src="https://via.placeholder.com/300/00FF00">
        <img src="https://via.placeholder.com/300/0000FF" data-src="https://via.placeholder.com/300/0000FF">
    </div>

    <script>
        document.getElementById("thumbs").addEventListener("click", function(e) {
            if(e.target.tagName === "IMG") {
                document.getElementById("main").src = e.target.getAttribute("data-src");
            }
        });
    </script>
</body>
</html>
