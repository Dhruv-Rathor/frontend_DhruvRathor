<!DOCTYPE html>
<html>
<head>
<style>
    /* Element Selector */
    body { font-family: Arial, sans-serif; background-color: #f0f8ff; }
    /* Class Selector */
    .highlight { color: rgb(255, 99, 71); }
    /* ID Selector */
    #main-title { color: #2e8b57; text-align: center; }
    /* Attribute Selector */
    input[type="text"] { border: 1px solid blue; }
    /* Pseudo-class */
    a:hover { color: red; }
</style>
</head>
<body>
    <h1 id="main-title">About Us</h1>
    <p class="highlight">We are a creative agency.</p>
    <p>Contact us: <a href="#">Click Here</a></p>
    <input type="text" placeholder="Search...">
</body>
</html>
