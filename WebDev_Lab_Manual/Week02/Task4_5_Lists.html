<!DOCTYPE html>
<html>
<head>
<style>
    /* Task 4: Favorite movie unique style */
    .movies li { color: gray; }
    #favorite { color: gold; font-weight: bold; font-size: 20px; }

    /* Task 5: Random CSS for cities */
    .cities { list-style-type: upper-roman; }
    .cities li:nth-child(odd) { background-color: #ddd; }
</style>
</head>
<body>
    <h3>Movies</h3>
    <ul class="movies">
        <li>Inception</li>
        <li id="favorite">The Matrix (Favorite)</li>
        <li>Interstellar</li>
    </ul>

    <h3>Cities</h3>
    <ol class="cities">
        <li>New York</li>
        <li>London</li>
        <li>Tokyo</li>
        <li>Paris</li>
    </ol>
</body>
</html>
