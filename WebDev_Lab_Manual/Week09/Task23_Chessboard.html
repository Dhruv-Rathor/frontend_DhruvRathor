<!DOCTYPE html>
<html>
<style>
    #board { width: 160px; display: flex; flex-wrap: wrap; border: 1px solid #000; }
    .cell { width: 20px; height: 20px; }
    .black { background: black; }
    .white { background: white; }
</style>
<body>
    <div id="board"></div>
    <script>
        const board = document.getElementById("board");
        for(let i=0; i<64; i++) {
            let div = document.createElement("div");
            div.className = "cell " + (parseInt((i / 8) + i) % 2 == 0 ? "white" : "black");
            board.appendChild(div);
        }
    </script>
</body>
</html>
