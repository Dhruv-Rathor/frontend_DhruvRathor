<!DOCTYPE html>
<html>
<head>
<style>
    .container { display: flex; }
    .sidebar { width: 25%; background: #333; color: white; padding: 20px; height: 100vh; }
    .content { padding: 20px; width: 75%; }
    
    /* Product Card */
    .card {
        border: 1px solid #ccc;
        width: 200px;
        padding: 15px;
        box-shadow: 5px 5px 10px rgba(0,0,0,0.1);
        text-align: center;
        margin-top: 20px;
    }
    .btn { background: blue; color: white; padding: 10px; border: none; cursor: pointer; }
</style>
</head>
<body>
    <div class="container">
        <div class="sidebar">Sidebar Menu</div>
        <div class="content">
            <h1>Product</h1>
            <div class="card">
                <img src="https://via.placeholder.com/100" alt="Product">
                <h3>Smart Watch</h3>
                <p>$199.99</p>
                <button class="btn">Buy Now</button>
            </div>
        </div>
    </div>
</body>
</html>
