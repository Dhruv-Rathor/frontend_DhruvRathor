<!DOCTYPE html>
<html>
<body>
    <input type="text" id="country" placeholder="Enter Country (e.g. India)">
    <button onclick="getUniversities()">Search</button>
    <ul id="results"></ul>

    <script>
        async function getUniversities() {
            let country = document.getElementById("country").value;
            let res = await fetch(`http://universities.hipolabs.com/search?country=${country}`);
            let data = await res.json();
            
            let list = document.getElementById("results");
            list.innerHTML = "";
            data.slice(0, 10).forEach(uni => {
                let li = document.createElement("li");
                li.innerHTML = `<b>${uni.name}</b> (<a href="${uni.web_pages[0]}">Link</a>)`;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
