<!DOCTYPE html>
<html>
<head><title>Timetable</title></head>
<body>
    <h2>Academic Timetable</h2>
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr style="background-color: #eee;">
                <th>Day</th>
                <th>9:00 - 10:00</th>
                <th>10:00 - 11:00</th>
                <th>11:00 - 12:00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>Math</td>
                <td>Physics</td>
                <td>Chemistry</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>CS</td>
                <td>English</td>
                <td>Sports</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" align="center">Lunch Break: 12:00 - 1:00</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
